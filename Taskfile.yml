# Vitals — menu bar system monitor. Builds with the command-line tools only (no Xcode).
# https://taskfile.dev
version: '3'

vars:
  APP_NAME: Vitals
  BUNDLE_ID: com.jackallen.vitals
  SIGN_ID: RunCat Local
  VERSION: 0.1.0
  BUILD_DIR: build
  APP: '{{.BUILD_DIR}}/{{.APP_NAME}}.app'
  CONTENTS: '{{.APP}}/Contents'
  # The CLT ships both the macOS 26.5 and 27.0 SDKs and defaults to 27.0, whose SwiftUI relies on
  # a macro plugin the CLT doesn't include. Pin the SDK that matches the installed OS.
  SDK: /Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk
  SWIFT_FLAGS: '--sdk {{.SDK}}'
  # Likewise the Swift Testing macro plugin lives in a subdirectory the build system doesn't search.
  TESTING_PLUGIN: /Library/Developer/CommandLineTools/usr/lib/swift/host/plugins/testing/libTestingMacros.dylib
  TEST_FLAGS: '{{.SWIFT_FLAGS}} -Xswiftc -load-plugin-library -Xswiftc {{.TESTING_PLUGIN}}'

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  build:
    desc: Debug build
    cmds:
      - swift build {{.SWIFT_FLAGS}}

  test:
    desc: Run the Swift Testing suite
    cmds:
      - swift test {{.TEST_FLAGS}}

  release:
    desc: Release build
    cmds:
      - swift build -c release {{.SWIFT_FLAGS}}

  app:
    desc: Package and sign {{.APP}}
    deps: [release]
    vars:
      RELEASE_BIN:
        sh: echo "$(swift build -c release {{.SWIFT_FLAGS}} --show-bin-path)/{{.APP_NAME}}"
    cmds:
      - rm -rf "{{.APP}}"
      - mkdir -p "{{.CONTENTS}}/MacOS" "{{.CONTENTS}}/Resources"
      - cp "{{.RELEASE_BIN}}" "{{.CONTENTS}}/MacOS/{{.APP_NAME}}"
      - sed -e 's/@VERSION@/{{.VERSION}}/g' -e 's/@BUNDLE_ID@/{{.BUNDLE_ID}}/g' Resources/Info.plist > "{{.CONTENTS}}/Info.plist"
      - if [ -f Resources/AppIcon.icns ]; then cp Resources/AppIcon.icns "{{.CONTENTS}}/Resources/"; fi
      - >-
        codesign --force --sign "{{.SIGN_ID}}" --identifier "{{.BUNDLE_ID}}" --options runtime
        --entitlements Resources/{{.APP_NAME}}.entitlements "{{.APP}}"
      - codesign --verify --deep --strict "{{.APP}}"
      - echo "Built {{.APP}}"

  run:
    desc: Build and launch the app
    deps: [app]
    cmds:
      - pkill -x {{.APP_NAME}} || true
      - open "{{.APP}}"

  screenshots:
    desc: Render the indicator, panel and settings to {{.BUILD_DIR}}/screenshots (no Screen Recording permission needed)
    deps: [app]
    cmds:
      - pkill -x {{.APP_NAME}} || true
      - rm -rf "{{.BUILD_DIR}}/screenshots"
      - '"{{.CONTENTS}}/MacOS/{{.APP_NAME}}" -Screenshot "{{.PWD}}/{{.BUILD_DIR}}/screenshots" -ScreenshotDelay {{.DELAY | default 2.5}}'
      - ls "{{.BUILD_DIR}}/screenshots"

  install:
    desc: Copy to /Applications and launch
    deps: [app]
    cmds:
      - pkill -x {{.APP_NAME}} || true
      - rm -rf "/Applications/{{.APP_NAME}}.app"
      - cp -R "{{.APP}}" /Applications/
      - open "/Applications/{{.APP_NAME}}.app"

  icon:
    desc: Regenerate Resources/AppIcon.icns
    cmds:
      - swift Scripts/make-icon.swift Resources/AppIcon.icns

  clean:
    desc: Remove build products
    cmds:
      - rm -rf .build {{.BUILD_DIR}}
